name: Deploy 42 Assets to Aptos Mainnet

on:
  push:
    branches: [ main ]

jobs:
  deploy-mainnet:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Execute Mainnet Emission Script
        env:
          APTOS_PRIVATE_KEY: ${{ secrets.APTOS_PRIVATE_KEY }}
        run: |
          python3 emit_mainnet.py
          echo "[+] Mainnet JSON payloads generated successfully."

      - name: Commit and Sync Manifest State
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git add Manifest.json mainnet_payloads.json || true
          git diff --staged --quiet || git commit -m "Auto-sync mainnet asset state and payload registry [skip ci]"
          git push origin main
